name: Nightly Key Health Check

on:
  schedule:
    # Runs nightly at 02:00 UTC (05:30 AM Tehran Time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  nightly-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure tgcloud credentials & Run Health Check
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          mkdir -p .tgcloud
          if [ -n "$TGCLOUD_TOKEN" ]; then
            echo "{\"token\":\"$TGCLOUD_TOKEN\"}" > .tgcloud/credentials
          else
            echo "Warning: TGCLOUD_TOKEN secret is not set yet. Please add it in GitHub Repository Settings -> Secrets and variables -> Actions."
          fi
          for attempt in 1 2 3; do
            echo "==> Health check run attempt $attempt..."
            if npx tgcloud run tgcloud/endpoints/cron '{"mode":"nightly_health"}'; then
              echo "==> Health check finished successfully on attempt $attempt."
              exit 0
            fi
            echo "==> Attempt $attempt encountered transient gateway error. Waiting 5s before retry..."
            sleep 5
          done
          echo "==> All retry attempts failed."
          exit 1
