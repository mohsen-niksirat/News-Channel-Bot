name: Hourly News Scan & Publish

on:
  schedule:
    # Runs twice an hour at minutes 15 and 45 (avoids congested minute 0 on GitHub)
    - cron: '15,45 * * * *'
  workflow_dispatch: # Allows manual one-click trigger from GitHub Actions tab

jobs:
  hourly-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure tgcloud credentials & Run Cron
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          mkdir -p .tgcloud
          if [ -n "$TGCLOUD_TOKEN" ]; then
            echo "{\"token\":\"$TGCLOUD_TOKEN\"}" > .tgcloud/credentials
          else
            echo "Warning: TGCLOUD_TOKEN secret is not set yet. Please add it in GitHub Repository Settings -> Secrets and variables -> Actions."
          fi
          # Resilient execution with retry for transient serverless gateway timeouts
          for attempt in 1 2 3; do
            echo "==> Cron run attempt $attempt..."
            if npx tgcloud run tgcloud/endpoints/cron "{}"; then
              echo "==> Cron finished successfully on attempt $attempt."
              exit 0
            fi
            echo "==> Attempt $attempt encountered transient gateway error. Waiting 5s before retry..."
            sleep 5
          done
          echo "==> All retry attempts failed."
          exit 1
